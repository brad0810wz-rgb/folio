name: Issue 394 Fork Validation
run-name: Validate issue 394 code a46cff5

on:
  push:
    branches: [ci/oct30-issue-394]

permissions:
  contents: read

concurrency:
  group: fork-oct30-394
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.2'
  CODE_REF: 'a46cff502c508c91325b49e007ff931a11e3db1c'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brad0810wz-rgb/folio
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - name: Verify PR revision
        run: test "$(git rev-parse HEAD)" = "$CODE_REF"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate checked-out code
        run: |
          bun run typecheck
          bun node_modules/typescript/bin/tsc --noEmit --project packages/longbridge-tools/tsconfig.json

  focused-tests:
    name: Focused tests (affected packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brad0810wz-rgb/folio
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - name: Verify PR revision
        run: test "$(git rev-parse HEAD)" = "$CODE_REF"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate checked-out code
        run: |
          set +e
          bun test packages/shared --isolate > "$RUNNER_TEMP/folio-focused.log" 2>&1
          folio_test_status=$?
          tail -n 80 "$RUNNER_TEMP/folio-focused.log"
          exit "$folio_test_status"

  full-unit:
    name: Full unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brad0810wz-rgb/folio
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - name: Verify PR revision
        run: test "$(git rev-parse HEAD)" = "$CODE_REF"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate checked-out code
        run: |
          set +e
          bun test --isolate > "$RUNNER_TEMP/folio-full.log" 2>&1
          folio_test_status=$?
          tail -n 80 "$RUNNER_TEMP/folio-full.log"
          exit "$folio_test_status"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brad0810wz-rgb/folio
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - name: Verify PR revision
        run: test "$(git rev-parse HEAD)" = "$CODE_REF"
      - name: Scan for high-signal secret patterns
        shell: bash
        run: |
          set -uo pipefail
          MATCHED_FILES=$(grep -rIlE \
            --exclude-dir=node_modules \
            --exclude-dir=docs \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='bun.lock' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            . || true)
          if [ -n "$MATCHED_FILES" ]; then
            echo '::error::Possible secret patterns found in the following files:'
            printf '%s\n' "$MATCHED_FILES"
            exit 1
          fi
          echo 'No secret patterns found.'

