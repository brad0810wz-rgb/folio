name: Combined Fixes Validation
run-name: Validate five fixes 1f61746

on:
  push:
    branches: [ci/oct30-combined-validation]

permissions:
  contents: read

concurrency:
  group: folio-oct30-combined
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.2'
  CODE_REF: '1f61746b7845794b966e22a61de7089370b486b5'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brad0810wz-rgb/folio
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - name: Verify PR revision
        run: test "$(git rev-parse HEAD)" = "$CODE_REF"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate checked-out code
        run: |
          bun run typecheck
          bun node_modules/typescript/bin/tsc --noEmit --project packages/longbridge-tools/tsconfig.json

  focused-tests:
    name: Focused tests (all affected packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brad0810wz-rgb/folio
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - name: Verify PR revision
        run: test "$(git rev-parse HEAD)" = "$CODE_REF"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate checked-out code
        run: |
          set +e
          bun test packages/longbridge-tools packages/shared packages/core packages/ui --isolate > "$RUNNER_TEMP/folio-focused.log" 2>&1
          folio_test_status=$?
          tail -n 80 "$RUNNER_TEMP/folio-focused.log"
          exit "$folio_test_status"

  full-unit:
    name: Full unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brad0810wz-rgb/folio
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - name: Verify PR revision
        run: test "$(git rev-parse HEAD)" = "$CODE_REF"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate checked-out code
        run: |
          set +e
          bun test --isolate > "$RUNNER_TEMP/folio-full.log" 2>&1
          folio_test_status=$?
          tail -n 80 "$RUNNER_TEMP/folio-full.log"
          exit "$folio_test_status"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brad0810wz-rgb/folio
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - name: Verify PR revision
        run: test "$(git rev-parse HEAD)" = "$CODE_REF"
      - name: Scan for high-signal secret patterns
        shell: bash
        run: |
          set -uo pipefail
          MATCHED_FILES=$(grep -rIlE \
            --exclude-dir=node_modules \
            --exclude-dir=docs \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='bun.lock' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            . || true)
          if [ -n "$MATCHED_FILES" ]; then
            echo '::error::Possible secret patterns found in the following files:'
            printf '%s\n' "$MATCHED_FILES"
            exit 1
          fi
          echo 'No secret patterns found.'


  windows-regressions:
    name: Windows affected regressions
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brad0810wz-rgb/folio
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - name: Verify tested revision
        run: test "$(git rev-parse HEAD)" = "$CODE_REF"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run affected regressions
        run: |
          set +e
          bun test packages/shared/src/calendar packages/shared/src/portfolio-risk packages/shared/src/alerts/evaluators.test.ts packages/shared/src/outcome packages/longbridge-tools/src/normalizer.test.ts packages/shared/src/capabilities/portfolio-short-pnl.test.ts packages/ui/src/components/evaluation packages/ui/src/components/workspace/FinanceWorkspace.selection.test.tsx --isolate > "$RUNNER_TEMP/folio-windows.log" 2>&1
          folio_test_status=$?
          tail -n 80 "$RUNNER_TEMP/folio-windows.log"
          exit "$folio_test_status"
